<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>folk — design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#141414;--disp:'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#f1f1f1}}
:root[data-theme="dark"]{--bg:#121212;--ink:#f1f1f1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit}
a:focus-visible,.tile:focus-visible,button:focus-visible{outline:3px solid #1f3bff;outline-offset:3px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:28px clamp(16px,4vw,52px)}
nav{display:flex;gap:22px}
nav a{font:400 26px/1 var(--disp);letter-spacing:.03em;text-decoration:none}
nav a:hover{text-decoration:underline;text-underline-offset:5px}
.logo{display:block;width:64px;height:64px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:0 clamp(16px,4vw,52px)}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.tile{position:relative;aspect-ratio:16/10;overflow:hidden;color:#fff;background:#222}
.cap{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
.cap h2{margin:0;font:400 36px/1 var(--disp);letter-spacing:.03em}
.cap p{margin:4px 0 0;font:400 22px/1 var(--disp)}
@media (hover:none){.cap{opacity:1;background:linear-gradient(transparent 60%,rgba(0,0,0,.65));place-content:end start;text-align:left;padding:14px}}
#contact{padding:96px clamp(16px,4vw,52px) 64px}
#contact h2{margin:0 0 8px;font:400 clamp(48px,8vw,96px)/1 var(--disp)}
#contact a.mail{font:400 clamp(28px,5vw,56px)/1.1 var(--disp);letter-spacing:.02em}
#contact p{margin:16px 0 0;max-width:46ch}
footer{padding:0 clamp(16px,4vw,52px) 40px;font-size:14px;opacity:.7}
#top{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border:0;border-radius:50%;background:rgba(128,128,128,.28);color:var(--ink);font-size:22px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
#top.on{opacity:1;pointer-events:auto}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile{cursor:pointer}
.cap{background:rgba(0,0,0,.45)}
dialog{border:0;padding:0;background:#000;width:min(1500px,96vw);max-width:96vw}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog video{display:block;width:100%;max-height:86vh}
#close{position:absolute;top:8px;right:8px;z-index:2;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:24px;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:20px}
.links a{font:400 clamp(28px,4vw,44px)/1.1 var(--disp);letter-spacing:.02em;text-decoration:none}
.links a:hover{text-decoration:underline;text-underline-offset:6px}
.skull-wrap{justify-self:end;display:block}
.skull{display:block;width:auto;height:clamp(84px,11vw,128px);pointer-events:none;user-select:none}
</style>
</head>
<body>
<header>
  <nav aria-label="Main"><a href="#work">WORK</a><a href="#contact">CONTACT</a></nav>
  <a href="#" aria-label="folk, top of page"><svg class="logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6"><circle cx="32" cy="32" r="26"></circle><path d="M32 18v30"></path><circle cx="32" cy="14" r="3" fill="currentColor" stroke="none"></circle></svg></a>
  <picture class="skull-wrap"><source srcset="skull-still.webp" media="(prefers-reduced-motion:reduce)"><img class="skull" src="skull.webp" width="320" height="216" alt="" draggable="false"></picture>
</header>

<main>
  <section id="work" class="grid" aria-label="Work">
    <article class="tile" tabindex="0" aria-label="PINA COLADA, open video"><video muted loop playsinline preload="metadata" src="%D1%82%D0%B8%D0%BA_%D1%82%D0%BE%D0%BA_2_%D0%B4%D0%B8%D1%81%D0%BA%D0%BE%D1%80%D0%B4_.mp4#t=0.1"></video><div class="cap"><h2>PINA COLADA</h2></div></article>
    <article class="tile" tabindex="0" aria-label="ASSIST, open video"><video muted loop playsinline preload="metadata" src="ASASASASASASASASASASASASIST.mp4#t=0.1"></video><div class="cap"><h2>ASSIST</h2></div></article>
    <article class="tile" tabindex="0" aria-label="KREY, open video"><video muted loop playsinline preload="metadata" src="KREY_INSTA.mp4#t=0.1"></video><div class="cap"><h2>KREY</h2></div></article>
    <article class="tile" tabindex="0" aria-label="MAKE SOME NOISE, open video"><video muted loop playsinline preload="metadata" src="IMG_3633.mp4#t=0.1"></video><div class="cap"><h2>MAKE SOME NOISE</h2></div></article>
    <article class="tile" tabindex="0" aria-label="YETTI4RL, open video"><video muted loop playsinline preload="metadata" src="yetti4rl.mp4#t=0.1"></video><div class="cap"><h2>YETTI4RL</h2></div></article>
    <article class="tile" tabindex="0" aria-label="TEAR, open video"><video muted loop playsinline preload="metadata" src="TEAR.mp4#t=0.1"></video><div class="cap"><h2>TEAR</h2></div></article>
    <article class="tile" tabindex="0" aria-label="FILM, open video"><video muted loop playsinline preload="metadata" src="film.mp4#t=0.1"></video><div class="cap"><h2>FILM</h2></div></article>
    <article class="tile" tabindex="0" aria-label="POST MODERN, open video"><video muted loop playsinline preload="metadata" src="post%20modern.mp4#t=0.1"></video><div class="cap"><h2>POST MODERN</h2></div></article>
    <article class="tile" tabindex="0" aria-label="KITCHEN, open video"><video muted loop playsinline preload="metadata" src="kitchen_%D0%BD%D0%B0%D1%81%D1%8B%D1%89%D0%B5%D0%BD%D0%BD%D1%8B%D0%B9.mp4#t=0.1"></video><div class="cap"><h2>KITCHEN</h2></div></article>
    <article class="tile" tabindex="0" aria-label="5TEC, open video"><video muted loop playsinline preload="metadata" src="5tec.mp4#t=0.1"></video><div class="cap"><h2>5TEC</h2></div></article>

    <article class="tile" tabindex="0" aria-label="SOCIAL CR1SIS, open video"><video muted loop playsinline preload="metadata" src="social_cr1sis.mp4#t=0.1"></video><div class="cap"><h2>SOCIAL CR1SIS</h2></div></article>
    <article class="tile" tabindex="0" aria-label="TEAR 2, open video"><video muted loop playsinline preload="metadata" src="tear_2.mp4#t=0.1"></video><div class="cap"><h2>TEAR 2</h2></div></article>

</main>

<footer>© 2026 folk</footer>
<dialog id="dlg"><button id="close" type="button" aria-label="Close">×</button><video id="big" controls playsinline loop></video></dialog>
<button id="top" type="button" aria-label="Back to top">↑</button>
<script>
(function(){
  var b=document.getElementById('top');
  function t(){b.classList.toggle('on',window.scrollY>400)}
  window.addEventListener('scroll',t,{passive:true});t();
  b.addEventListener('click',function(){window.scrollTo({top:0})});
  var tiles=document.querySelectorAll('.tile'),dlg=document.getElementById('dlg'),big=document.getElementById('big');
  var touch=matchMedia('(hover:none)').matches,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  tiles.forEach(function(t){
    var v=t.querySelector('video');
    v.addEventListener('loadeddata',function(){if(v.currentTime===0)v.currentTime=0.05});
    if(touch&&!calm){v.play().catch(function(){})}
    else if(!touch){
      t.addEventListener('mouseenter',function(){v.play().catch(function(){})});
      t.addEventListener('mouseleave',function(){v.pause()});
    }
    function open(){v.pause();big.src=v.currentSrc.split('#')[0];big.muted=false;dlg.showModal();big.play().catch(function(){})}
    t.addEventListener('click',open);
    t.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
  });
  function shut(){big.pause();dlg.close()}
  document.getElementById('close').addEventListener('click',shut);
  dlg.addEventListener('click',function(e){if(e.target===dlg)shut()});
  dlg.addEventListener('close',function(){big.removeAttribute('src');big.load()});
})();
</script>
